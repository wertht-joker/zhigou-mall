# 一键起全套依赖 + 应用：
#   docker compose up -d              启动 postgres / redis / milvus / backend / frontend
#   docker compose up -d postgres redis milvus  只起依赖，backend 在本地跑（便于调试）
#   docker compose down               停止并保留数据卷
#   docker compose down -v            停止并清空数据卷
#
# 说明：后端启动时会自动执行 alembic upgrade head，无需手工建表。

services:
  # ===================== 关系库（业务数据）=====================
  postgres:
    container_name: kb-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== 缓存 / 限流 =====================
  redis:
    container_name: kb-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./volumes/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== 向量库（Milvus 单机版）=====================
  # 元数据存储
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 对象存储（存向量/索引文件）
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 单机服务
  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # gRPC 接口（后端连这里）
      - "9091:9091"     # 监控指标
    depends_on:
      - "etcd"
      - "minio"

  # ===================== 后端 API =====================
  backend:
    container_name: kb-backend
    build:
      context: ./backend
    environment:
      # 容器内一律走服务名，不用 localhost
      DATABASE_URL: postgresql+psycopg://kb:kb@postgres:5432/kb
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      # 容器化部署仍走 Milvus；本地直接跑默认用内嵌 SQLite 向量库
      VECTOR_BACKEND: milvus
      LOG_JSON: "true"
      # 推理只跑 CPU，容器内不下载 GPU 相关依赖
      EMBEDDING_DEVICE: cpu
      # 密钥等敏感配置从宿主机 backend/.env 读取（可选）
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./volumes/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started

  # ===================== 前端 =====================
  frontend:
    container_name: kb-frontend
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

networks:
  default:
    name: kb
