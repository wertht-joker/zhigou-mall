# CI：后端跑 pytest（全部外部依赖已打桩，不联网、不依赖 Milvus），前端跑构建
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试
        working-directory: backend
        # 测试用内存 SQLite + 打桩 LLM/Milvus，无需任何外部服务
        env:
          LOG_JSON: "false"
          RATE_LIMIT_ENABLED: "true"
          ORDER_EXPIRE_SWEEP_ENABLED: "false"
        run: pytest -q

  quality:
    name: 后端静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 ruff
        run: pip install "ruff>=0.6"

      - name: Ruff（语法与未定义名）
        working-directory: backend
        run: ruff check app tests --select E9,F63,F7,F82

  miniapp:
    name: 小程序构建（H5）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: 安装依赖
        working-directory: miniapp
        run: npm ci

      - name: 构建 H5
        working-directory: miniapp
        run: npm run build:h5

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建
        working-directory: frontend
        run: npm run build
